  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CJNINE</title>

  <style>
    * {

      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    header {
      height: 80px;
      display: flex;
      align-items: center;
      padding: 0 6%;
      background: #080808;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #d9a441;
    }

    main {
      min-height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    h1 {
      font-size: 48px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">CJNINE</div>
  </header>

  <main>
    <h1>เว็บไซต์ CJNINE</h1>

</html>
